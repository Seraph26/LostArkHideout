name: Update Lost Ark raid manifest

on:
  push:
    paths:
      - "scripts/update-raid-manifest.py"
      - ".github/workflows/update-raid-manifest.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update manifest from Bible
        run: python3 scripts/update-raid-manifest.py

      - name: Commit changes
        run: |
          if git diff --quiet -- raid-encounters.json; then
            echo "Raid manifest unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raid-encounters.json
          git commit -m "Auto-update Lost Ark raid encounter list"
          git push
